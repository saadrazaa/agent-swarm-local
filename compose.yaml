# Local Agent Swarm — trimmed single-user Apple Silicon deployment.
# Image pins live in versions.env; secrets/identity live in .env (git-ignored).
# Always run with BOTH env files:
#   docker compose --env-file versions.env --env-file .env <cmd>
#
# Fixed project + volume names guarantee that moving this repo never creates a
# second empty set of volumes. Only loopback ports are published.
name: agent-swarm-local

secrets:
  encryption_key:
    file: ./encryption_key

networks:
  default:
    name: agent-swarm-local
    # Normal bridge (NOT internal): providers, Git, templates, and the embedding
    # model are outbound network downloads.

volumes:
  agent_fs_minio: { name: agent_fs_minio }
  agent_fs_data: { name: agent_fs_data }
  swarm_api_data: { name: swarm_api_data }
  swarm_logs: { name: swarm_logs }
  swarm_shared: { name: swarm_shared }
  swarm_tars: { name: swarm_tars }
  swarm_chase: { name: swarm_chase }
  swarm_rocky: { name: swarm_rocky }
  swarm_rocky_codex: { name: swarm_rocky_codex }
  swarm_einstein: { name: swarm_einstein }

services:
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT}:9000" # console 9001 intentionally NOT published
    volumes:
      - agent_fs_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  minio-init:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/agentfs
        echo "minio-init: bucket 'agentfs' ready"
    restart: "no"

  agent-fs:
    image: ${AGENT_FS_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AGENT_FS_HOME: /data
      HOST: 0.0.0.0
      SERVER_HOST: 0.0.0.0
      PORT: "7433"
      SERVER_PORT: "7433"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT}
      S3_BUCKET: agentfs
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_PROVIDER: minio
      EMBEDDING_PROVIDER: local
      # Stamps a browser-viewable "live" link onto every file response
      # (<AGENT_FS_APP_URL>/file/~/<orgId>/<driveId>/<path>) and is the hosted
      # viewer that renders them. https://live.agent-fs.dev is a stateless SPA.
      AGENT_FS_APP_URL: https://live.agent-fs.dev
    ports:
      - "127.0.0.1:7433:7433" # diagnostics only
    volumes:
      - agent_fs_data:/data
    # Node-based health check reused verbatim from upstream v1.119.1: the agent-fs
    # image ships node/bun but no curl/wget. The generous retry window covers the
    # first-boot local embedding-model download before the service listens.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s

  # Makes agent-fs browsable by you. agent-fs is multi-tenant and every service
  # auto-registers a private identity whose key is generated server-side and
  # kept encrypted in the API — so out of the box no key can browse the data in
  # the live viewer. This one-shot reconciles a human "viewer" identity whose
  # key is AGENT_FS_VIEWER_KEY (in .env) and adds it to every org/drive. It only
  # writes org_members/drive_members rows (agent-fs has no invite API reachable
  # without an org-admin key). Idempotent; nothing depends on it, so a failure
  # never blocks the swarm. Re-run after agents create new orgs: make agent-fs-viewer
  agent-fs-viewer-init:
    image: ${AGENT_FS_IMAGE}
    depends_on:
      agent-fs:
        condition: service_healthy
    environment:
      AGENT_FS_VIEWER_KEY: ${AGENT_FS_VIEWER_KEY:-}
      AGENT_FS_VIEWER_EMAIL: ${AGENT_FS_VIEWER_EMAIL:-viewer@local}
    entrypoint: ["bun", "/init.mjs"]
    volumes:
      - agent_fs_data:/data
      - ./scripts/agent-fs-viewer-init.mjs:/init.mjs:ro
    restart: "no"

  api:
    image: ${AGENT_SWARM_IMAGE}
    depends_on:
      agent-fs:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      RBAC_ENABLED: "false"
      AGENT_FS_API_URL: http://agent-fs:7433
      AGENT_FS_REGISTER_EMAIL: swarm-admin@agent-fs.local
      TRUST_BODY_REQUESTED_BY_USER_ID: "true"
      # API registers its own agent-fs identity and stores it encrypted; do NOT
      # set API_AGENT_FS_API_KEY, and never hand that key to workers.
      SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      MCP_BASE_URL: http://127.0.0.1:3013
      PUBLIC_MCP_BASE_URL: http://127.0.0.1:3013
      # Where the browser dashboard lives; the API uses it only to build outbound
      # links (e.g. HITL approval URLs). Default = hosted UI; override in .env with
      # APP_URL=http://127.0.0.1:5274 if you run apps/ui locally instead.
      APP_URL: ${APP_URL:-https://app.agent-swarm.dev}
      SLACK_DISABLE: "true"
      GITHUB_DISABLE: "true"  # disables INBOUND webhooks only; worker GITHUB_TOKEN still works
      LINEAR_DISABLE: "true"
      JIRA_DISABLE: "true"
      ANONYMIZED_TELEMETRY: "false"
      # Memory embeddings (semantic memory-search). The API embeds agent_memory
      # rows with OpenAI text-embedding-3-small, reading EMBEDDING_API_KEY then
      # OPENAI_API_KEY from its own environment. Without a key the provider
      # silently stores NULL embeddings — no error is logged — and every
      # memory-search degrades to keyword-only FTS (GET /api/memory/health
      # reports retrievalMode "fallback"). Reuse the OpenAI key .env already
      # carries for rocky, under the embedding-specific name so the API's other
      # OpenAI codepaths stay untouched. After first enabling this, backfill
      # existing rows once: POST /api/memory/re-embed (see docs/OPERATIONS.md).
      EMBEDDING_API_KEY: ${OPENAI_API_KEY:-}
      # NOTE: HEARTBEAT_CHECKLIST_DISABLE exists but is left unset deliberately —
      # it's parsed as Boolean(env), so any non-empty value (even "false") disables
      # the checklist.
      # >=1.121.0 gates MCP tool groups by CAPABILITIES with a new default that
      # drops `services` (and leaves swarm-x/agentmail/kapso/prompt-templates
      # off). Explicit list = new default + services, preserving the v1.119.1
      # tool surface this stack actually used. Gates MCP tool registration
      # only; SLACK_DISABLE etc. still control integrations.
      CAPABILITIES: "core,task-pool,scripts,config,mcp,profiles,scheduling,memory,workflows,pages,metrics,kv,slack,tracker,skills,repo,services"
    ports:
      - "127.0.0.1:3013:3013"
    volumes:
      - swarm_api_data:/app/data # NOT /app — the DB lives under /app/data; /app/migrations must stay image-owned
    secrets:
      - encryption_key
    # The API image ships curl AND wget (unlike agent-fs); reuse upstream's probe.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 60s

  tars:
    image: ${AGENT_SWARM_WORKER_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      # Share-link hosts for agent-generated URLs (dashboard pages, agent-fs
      # files, plain-copy domains). Without these the only host an agent sees
      # is MCP_BASE_URL (http://api:3013) and every share link it emits is a
      # container-internal URL no human can open. Defaults match this stack:
      # hosted dashboard + hosted agent-fs viewer; override in .env if you run
      # the UI locally.
      APP_URL: ${APP_URL:-https://app.agent-swarm.dev}
      SWARM_URL: ${SWARM_URL:-app.agent-swarm.dev}
      AGENT_FS_LIVE_URL: ${AGENT_FS_LIVE_URL:-https://live.agent-fs.dev}
      MAX_CONCURRENT_TASKS: "3"
      YOLO: "false"
      ANONYMIZED_TELEMETRY: "false"
      AGENT_ID: ${LEAD_AGENT_ID}
      AGENT_NAME: TARS
      AGENT_ROLE: lead
      TEMPLATE_ID: official/lead
      HARNESS_PROVIDER: claude
      # Claude auth: set EXACTLY ONE in .env — an Anthropic API key
      # (ANTHROPIC_API_KEY, sk-ant-api…, API billing) OR a Claude Code OAuth
      # token (CLAUDE_CODE_OAUTH_TOKEN, sk-ant-oat…, subscription quota).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_tars:/workspace/personal
    restart: unless-stopped
    stop_grace_period: 60s

  chase:
    image: ${AGENT_SWARM_WORKER_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      # Share-link hosts for agent-generated URLs (dashboard pages, agent-fs
      # files, plain-copy domains). Without these the only host an agent sees
      # is MCP_BASE_URL (http://api:3013) and every share link it emits is a
      # container-internal URL no human can open. Defaults match this stack:
      # hosted dashboard + hosted agent-fs viewer; override in .env if you run
      # the UI locally.
      APP_URL: ${APP_URL:-https://app.agent-swarm.dev}
      SWARM_URL: ${SWARM_URL:-app.agent-swarm.dev}
      AGENT_FS_LIVE_URL: ${AGENT_FS_LIVE_URL:-https://live.agent-fs.dev}
      MAX_CONCURRENT_TASKS: "3"  # official/coder advertises maxTasks:3 — cap explicitly
      YOLO: "false"
      ANONYMIZED_TELEMETRY: "false"
      AGENT_ID: ${CLAUDE_WORKER_AGENT_ID}
      AGENT_NAME: CHASE
      AGENT_ROLE: worker
      TEMPLATE_ID: official/coder
      HARNESS_PROVIDER: claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_chase:/workspace/personal
    restart: unless-stopped
    stop_grace_period: 60s

  rocky:
    image: ${AGENT_SWARM_WORKER_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      # Share-link hosts for agent-generated URLs (dashboard pages, agent-fs
      # files, plain-copy domains). Without these the only host an agent sees
      # is MCP_BASE_URL (http://api:3013) and every share link it emits is a
      # container-internal URL no human can open. Defaults match this stack:
      # hosted dashboard + hosted agent-fs viewer; override in .env if you run
      # the UI locally.
      APP_URL: ${APP_URL:-https://app.agent-swarm.dev}
      SWARM_URL: ${SWARM_URL:-app.agent-swarm.dev}
      AGENT_FS_LIVE_URL: ${AGENT_FS_LIVE_URL:-https://live.agent-fs.dev}
      MAX_CONCURRENT_TASKS: "3"  # official/coder advertises maxTasks:3 — cap explicitly
      YOLO: "false"
      ANONYMIZED_TELEMETRY: "false"
      AGENT_ID: ${CODEX_WORKER_AGENT_ID}
      AGENT_NAME: ROCKY
      AGENT_ROLE: worker
      TEMPLATE_ID: official/coder
      HARNESS_PROVIDER: codex
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_rocky:/workspace/personal
      - swarm_rocky_codex:/home/worker/.codex
    restart: unless-stopped
    stop_grace_period: 60s

  einstein:
    image: ${AGENT_SWARM_WORKER_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      # Share-link hosts for agent-generated URLs (dashboard pages, agent-fs
      # files, plain-copy domains). Without these the only host an agent sees
      # is MCP_BASE_URL (http://api:3013) and every share link it emits is a
      # container-internal URL no human can open. Defaults match this stack:
      # hosted dashboard + hosted agent-fs viewer; override in .env if you run
      # the UI locally.
      APP_URL: ${APP_URL:-https://app.agent-swarm.dev}
      SWARM_URL: ${SWARM_URL:-app.agent-swarm.dev}
      AGENT_FS_LIVE_URL: ${AGENT_FS_LIVE_URL:-https://live.agent-fs.dev}
      MAX_CONCURRENT_TASKS: "2"
      YOLO: "false"
      ANONYMIZED_TELEMETRY: "false"
      AGENT_ID: ${RESEARCHER_AGENT_ID}
      AGENT_NAME: EINSTEIN
      AGENT_ROLE: worker
      TEMPLATE_ID: official/researcher
      HARNESS_PROVIDER: claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_einstein:/workspace/personal
    restart: unless-stopped
    stop_grace_period: 60s
